# 微信推送定时任务
name: 微信推送-鹰潭

# Controls when the workflow will run
on:
  workflow_dispatch:
  # 定时触发：每天早上8点30分（cron 使用 UTC 时间，北京时间 UTC+8）
  schedule:
    - cron: '25 8 * * *'       # 错开整点/半点高峰，减少排队延迟
      timezone: 'Asia/Shanghai' # 直接指定北京时间，无需再减8小时

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # 配置 Python 3.12 环境
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 先升级 pip，再安装 requirements.txt 中的依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 执行 main.py 脚本
      - name: Run main.py
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CITI_BEIHAI: ${{ secrets.CITI_YINGTAN }}
          OPEN_ID_ME: ${{ secrets.OPEN_ID_MM }}
          WEATHER_TEMPLATE_ID: ${{ secrets.WEATHER_TEMPLATE_ID }}
        run: python main.py
